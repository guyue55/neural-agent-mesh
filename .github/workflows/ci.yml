name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Syntax + real-browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: |
          for f in server.mjs src/*.js tools/*.mjs; do
            node --check "$f"
          done

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Serve site and run verification suites
        run: |
          PORT=4173 node server.mjs &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          echo "=== functional suite ==="
          BASE_URL=http://127.0.0.1:4173/ node tools/verify.mjs
          echo "=== viewport suite ==="
          BASE_URL=http://127.0.0.1:4173/ node tools/verify-viewports.mjs

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-shots
          path: tools/shots/
          if-no-files-found: ignore
